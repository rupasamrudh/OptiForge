[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optiforge"
version = "0.1.0"
description = "A from-scratch mathematical optimization solver for LP and MILP problems."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.26",
    "httpx2>=0.1",
]

[tool.setuptools.packages.find]
include = ["optiforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

